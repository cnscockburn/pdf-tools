<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Soft resting shadow filter to ground the app icon -->
    <filter id="resting-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1c1917" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container (Surface Light) -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5" filter="url(#resting-shadow)" />
  
  <!-- Centered Document Sheet (Surface White fill) -->
  <g transform="translate(38, 33)">
    <!-- Document Outline -->
    <rect x="0" y="0" width="44" height="54" rx="4" fill="#ffffff" stroke="#1c1917" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Folded Corner -->
    <path d="M 34 0 L 44 10 M 34 0 H 44 V 10" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Text Lines -->
    <line x1="8" y1="14" x2="36" y2="14" stroke="#78716c" stroke-width="3" stroke-linecap="round" />
    
    <!-- The Highlighted Stria -->
    <rect x="6" y="21" width="26" height="10" rx="2" fill="#fffbeb" />
    <line x1="8" y1="26" x2="28" y2="26" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
    <line x1="32" y1="26" x2="36" y2="26" stroke="#a8a29e" stroke-width="3" stroke-linecap="round" />
    
    <line x1="8" y1="38" x2="22" y2="38" stroke="#78716c" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
