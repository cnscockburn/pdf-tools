<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Stylized Document Outline -->
  <rect x="14" y="10" width="36" height="44" rx="4" stroke="#1c1917" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Folded Corner Indicator (Clean geometric diagonal) -->
  <path d="M 42 10 L 50 18 M 42 10 H 50 V 18" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Text lines (Muted, warm-stone neutral) -->
  <line x1="20" y1="22" x2="44" y2="22" stroke="#78716c" stroke-width="3" stroke-linecap="round" />
  
  <!-- The "Stria" - Highlighted Line (Amber accent) -->
  <!-- Subtle highlight background tint -->
  <rect x="18" y="28" width="22" height="8" rx="2" fill="#fffbeb" />
  <!-- The precise amber strike -->
  <line x1="20" y1="32" x2="38" y2="32" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
  <line x1="42" y1="32" x2="44" y2="32" stroke="#a8a29e" stroke-width="3" stroke-linecap="round" />
  
  <line x1="20" y1="42" x2="32" y2="42" stroke="#78716c" stroke-width="3" stroke-linecap="round" />
</svg>
