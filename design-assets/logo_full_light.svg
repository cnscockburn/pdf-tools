<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="none">
  <!-- Centered Icon (scaled down to 32x32) -->
  <g transform="translate(8, 8) scale(0.5)">
    <!-- Document Outline -->
    <rect x="14" y="10" width="36" height="44" rx="4" stroke="#1c1917" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Folded Corner Indicator -->
    <path d="M 42 10 L 50 18 M 42 10 H 50 V 18" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lines -->
    <line x1="20" y1="22" x2="44" y2="22" stroke="#78716c" stroke-width="3" stroke-linecap="round" />
    
    <!-- Highlighted "Stria" -->
    <rect x="18" y="28" width="22" height="8" rx="2" fill="#fffbeb" />
    <line x1="20" y1="32" x2="38" y2="32" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
    <line x1="42" y1="32" x2="44" y2="32" stroke="#a8a29e" stroke-width="3" stroke-linecap="round" />
    
    <line x1="20" y1="42" x2="32" y2="42" stroke="#78716c" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- "Stria" Wordmark text (Semibold, precise tracking) -->
  <text x="48" y="29" fill="#1c1917" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="20px" font-weight="600" letter-spacing="-0.02em">Stria</text>
  
  <!-- Subtle subtitle -->
  <text x="48" y="39" fill="#78716c" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="9px" font-weight="500" letter-spacing="0.06em">PDF TOOLKIT</text>
</svg>
